<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="styles.css"><title>MyTube AI</title></head>
<body><header><h2>🎬 MyTube AI</h2><button id="theme">Light / Dark</button></header><main>
<h1>Your personal drama studio</h1><p>Plan stories, characters, pets, scenes, voices and music.</p>
<section class="panel"><h2>Create a drama</h2><input id="title" placeholder="Drama title"><textarea id="idea" placeholder="Describe your drama idea..."></textarea><select id="format"><option>Vertical (9:16)</option><option>Horizontal (16:9)</option></select><button id="create">Create project</button></section>
<section class="panel"><h2>Your projects</h2><div id="projects"></div></section>
<section class="panel"><h2>Backup</h2><button id="backup">Export backup</button><label class="file">Restore backup <input id="restore" type="file" accept=".json"></label></section>
</main><dialog id="editor"><button id="close" class="right">Close</button><h2 id="projectTitle"></h2><nav id="tabs"></nav><div id="content"></div></dialog><script src="app.js"></script></body></html>
